# **手元のコマンドのイメージが作れるかの見張り。**
#
# 版は Renovate が上げる。ダウンロードの URL の形が版で変わると (ファイル名の付け方が変わるなど)、
# マージされたあと手元の t.ps1 で初めて 404 に気づくことになる。PR の時点でイメージを作り、全部のコマンドが動くことを見る。
name: tools

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tools .
      - run: docker run --rm tools sh -euc 'aws --version; jq --version'
